<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1e5b47">
  <script>document.documentElement.classList.add("js");</script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/source-sans-3-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/libre-caslon-text-normal-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/site.css">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
</head>
<body class="{{bodyClass}}">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="review-banner" role="note">
    <p>Review copy. This version is not public. The forms on this site do not send anything.</p>
  </div>
  {{header}}
  <main id="main" tabindex="-1">
{{content}}
  </main>
  {{footer}}
  {{scripts}}
</body>
</html>
